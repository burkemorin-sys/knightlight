<style>

  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

  canvas { display: block; background: #120a1e; outline: none; }

  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }

/** Level edges behave like invisible walls; above/below the map is empty. */
function tileAt(L, c, r) {
  if (c < 0 || c >= L.w) return 'B';
  if (r < 0 || r >= L.h) return '.';
  return L.grid[r][c];

/** Turns a LEVELS entry into a mutable grid + lists of entity spawns. */
function parseLevel(idx) {

  const L = { idx, def, w, h: grid.length, grid, start: { x: 64, y: 64 }, embers: [], socks: [], spawns: [],
    jets: [], bubbles: [], checkpoints: [], goal: null, hasBoss: false, crumbles: new Map(), springs: new Map(), balloonPk: [] };
  for (let r = 0; r < L.h; r++) for (let c = 0; c < w; c++) {

      case 'o': L.embers.push({ x: cx, y: cy, taken: false, ph: Math.random() * 6 }); grid[r][c] = '.'; break;
      case 'w': L.balloonPk.push({ x: cx, y: cy, taken: false, ph: Math.random() * 6 }); grid[r][c] = '.'; break;
      case 's': L.socks.push({ x: cx, y: cy, taken: false, ph: Math.random() * 6 }); grid[r][c] = '.'; break;
      case 'C': L.checkpoints.push({ c, r, x: c * T, y: (r + 1) * T, lit: false }); grid[r][c] = '.'; break;
      case 'G': L.goal = { c, r, x: c * T, y: (r + 1) * T }; grid[r][c] = '.'; break;
      case 'F': L.jets.push({ c, r, x: c * T, y: (r + 1) * T, phase: (c * 0.53) % 3, wasOn: false }); grid[r][c] = '.'; break;
      case 'L': L.bubbles.push({ c, r, x: cx, baseY: r * T + 12, y: r * T + 40, vy: 0, state: 'wait', t: 0.4 + (c * 0.61) % 2.2 }); grid[r][c] = '~'; break;
      case 'a': case 'g': case 'S': case 'd':
        L.spawns.push({ type: ch, c, r }); if (ch === 'S') L.hasBoss = true; grid[r][c] = '.'; break;
    }
  }
  L.goalLocked = L.hasBoss;
  return L;
}
/** The rectangle that triggers level completion. */
function goalRect(L) { return { x: L.goal.x + 4, y: L.goal.y - 2 * T, w: T - 8, h: 2 * T }; }

/* ---------------------------------------------------------------- 7. COLLISION
   Bodies are {x,y,w,h,vx,vy}. Movement is split into small sub-steps (<=6px),
   resolving X then Y each sub-step against solid tiles, so fast objects never
   tunnel and corners never snag. One-way planks only block from above. */
function moveBody(o, dx, dy, L) {
  const res = { floor: false, ceil: false, wallL: false, wallR: false, ceilCells: [] };
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6));
  const sx = dx / n, sy = dy / n;
  for (let i = 0; i < n; i++) {
    if (sx !== 0) {
      o.x += sx;
      const r0 = Math.floor(o.y / T), r1 = Math.floor((o.y + o.h - 0.01) / T);
      if (sx > 0) {
        const c = Math.floor((o.x + o.w - 0.01) / T);
        for (let r = r0; r <= r1; r++) if (isSolid(tileAt(L, c, r))) { o.x = c * T - o.w; o.vx = 0; res.wallR = true; break; }
      } else {
        const c = Math.floor(o.x / T);
        for (let r = r0; r <= r1; r++) if (isSolid(tileAt(L, c, r))) { o.x = (c + 1) * T; o.vx = 0; res.wallL = true; break; }
      }
    }
    if (sy !== 0) {
      const prevBottom = o.y + o.h;
      o.y += sy;
      const c0 = Math.floor(o.x / T), c1 = Math.floor((o.x + o.w - 0.01) / T);
      if (sy > 0) {
        const r = Math.floor((o.y + o.h - 0.01) / T);
        for (let c = c0; c <= c1; c++) {
          const ch = tileAt(L, c, r);
          if (isSolid(ch) || (isOneWay(ch) && prevBottom <= r * T + 0.5)) { o.y = r * T - o.h; o.vy = 0; res.floor = true; break; }
        }
      } else {
        const r = Math.floor(o.y / T);
        for (let c = c0; c <= c1; c++) if (isSolid(tileAt(L, c, r))) res.ceilCells.push({ c, r });
        if (res.ceilCells.length) { o.y = (r + 1) * T; o.vy = 0; res.ceil = true; }
      }
    }
  }
  return res;
}

/** Returns the hazard cause the box touches ('spikes' | 'fire' | 'pit') or null.
 *  Hazard hitboxes are a little smaller than the art: fair, readable deaths. */
function hazardAt(p, L) {
  if (p.y > L.h * T + 24) return 'pit';
  const b = { x: p.x + 2, y: p.y + 2, w: p.w - 4, h: p.h - 2 };
  const c0 = Math.floor(b.x / T), c1 = Math.floor((b.x + b.w) / T);
  const r0 = Math.floor(b.y / T), r1 = Math.floor((b.y + b.h) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const ch = tileAt(L, c, r), x = c * T, y = r * T;
    if (ch === '^' && overlap(b, { x: x + 5, y: y + 15, w: 22, h: 17 })) return 'spikes';
    if (ch === 'v' && overlap(b, { x: x + 5, y: y, w: 22, h: 17 })) return 'spikes';
    if (ch === '~' && overlap(b, { x: x, y: y + (tileAt(L, c, r - 1) === '~' ? 0 : 12), w: T, h: T })) return 'fire';
  }
  return null;
}

/* ---------------------------------------------------------------- 8. PLAYER */
function makePlayer(x, y) {
  return { x, y, w: PW, h: PH, vx: 0, vy: 0, onGround: false, coyote: 0, buffer: 0, jumping: false,
    face: 1, walkT: 0, squash: 1, invuln: 0, dead: false, charred: false, helmetOff: false, prevBottom: y + PH };
}
/**
 * Advances player physics by dt. Touches nothing but the player object and
 * the optional ev object, so the exact same code is used by the real game and
 * by the level-completability analyser (see section 13).
 * inp = {left, right, jumpPressed, jumpHeld}
 */
function stepPlayer(p, inp, dt, L, ev) {
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  // --- horizontal: accelerate toward input, otherwise friction
  if (dir !== 0) {
    let a = p.onGround ? PHYS.groundAccel : PHYS.airAccel;
    if (Math.sign(p.vx) === -dir) a += p.onGround ? PHYS.groundFriction : PHYS.airFriction; // snappy turnarounds
    if (p.vx * dir <= PHYS.runSpeed) {
      p.vx += dir * a * dt;
      if (p.vx * dir > PHYS.runSpeed) p.vx = dir * PHYS.runSpeed; // hard cap at run speed
    } else {
      // moving faster than run speed (boss-stomp knockback): ease back down
      p.vx -= dir * 900 * dt;
      if (p.vx * dir < PHYS.runSpeed) p.vx = dir * PHYS.runSpeed;
    }
    p.face = dir;
  } else {
    const f = (p.onGround ? PHYS.groundFriction : PHYS.airFriction) * dt;
    p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
  }
  // --- coyote time & jump buffer
  p.coyote = p.onGround ? PHYS.coyoteTime : p.coyote - dt;
  p.buffer = inp.jumpPressed ? PHYS.jumpBuffer : p.buffer - dt;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -PHYS.jumpVel; p.onGround = false; p.coyote = 0; p.buffer = 0; p.jumping = true;
    if (ev) ev.jump = true;
  }
  // --- variable jump height: let go early = shorter hop
  if (p.jumping && !inp.jumpHeld && p.vy < 0) { p.vy *= PHYS.jumpCutMul; p.jumping = false; }
  if (p.vy >= 0) p.jumping = false;
  // --- gravity with terminal velocity
  p.vy = Math.min(p.vy + PHYS.gravity * (p.vy > 0 ? PHYS.fallGravityMul : 1) * dt, PHYS.maxFall);
  // --- move & collide
  const fallSpeed = p.vy;
  const res = moveBody(p, p.vx * dt, p.vy * dt, L);
  const was = p.onGround;
  p.onGround = res.floor;
  if (res.floor) { // bouncy toadstool underfoot? boing.
    const r = Math.floor((p.y + p.h + 1) / T);
    for (let c = Math.floor(p.x / T); c <= Math.floor((p.x + p.w - 0.01) / T); c++) {
      if (tileAt(L, c, r) === 'J') {
        p.vy = -PHYS.springVel; p.onGround = false; p.jumping = false; p.coyote = 0;
        if (ev) ev.spring = { c, r };
        break;
      }
    }
  }
  if (ev) {
    if (res.ceil) ev.bump = res.ceilCells;
    if (!was && p.onGround && !ev.spring) { ev.land = true; ev.landSpeed = fallSpeed; }
  }
}

/* ---------------------------------------------------------------- 9. ENTITIES */
/** Builds the dragon list from the level's spawn records (also used on respawn). */
function spawnEnemies(L) {
  const list = [];
  for (const s of L.spawns) {
    if (s.type === 'a') list.push({ type: 'snap', x: s.c * T + 4, y: (s.r + 1) * T - 22, w: 24, h: 22, vx: 0, vy: 0, dir: -1, t: Math.random() * 5, alive: true, deadT: 0, talk: rnd(3, 9) });
    else if (s.type === 'g') list.push({ type: 'grum', baseX: s.c * T + 16, baseY: s.r * T + 16, x: s.c * T, y: s.r * T, w: 30, h: 24, vy: 0, t: Math.random() * 6, face: -1, spit: rnd(1.2, 2.2), puff: 0, alive: true, deadT: 0, rot: 0, talk: rnd(4, 10) });
    else if (s.type === 'd') list.push({ type: 'droop', x: s.c * T + 4, y: s.r * T, w: 24, h: 22, vx: 0, vy: 0, dir: -1, state: 'hang', st: 0, t: Math.random() * 5, alive: true, deadT: 0, talk: rnd(3, 8) });
    else if (s.type === 'S') {
      const w = 100, h = 80, x = s.c * T + T / 2 - w / 2;
      list.push({ type: 'boss', x, y: (s.r + 1) * T - h, w, h, homeX: x, minX: x - 9 * T, maxX: x + 3 * T, vx: 0, face: -1, hp: 3,
        state: 'sleep', t: 0, stateT: 0, fireT: 0, taunt: 4, alive: true, deadT: 0 });
    }
  }
  return list;
}

function addParticle(x, y, vx, vy, life, color, size, kind = 'spark', grav = 0) {
  if (G.particles.length > 500) return;
  G.particles.push({ x, y, vx, vy, life, max: life, color, size, kind, grav });
}
function burst(x, y, n, colors, speed = 120, life = 0.6, kind = 'spark', grav = 300) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(speed * 0.3, speed);
    addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(life * 0.5, life), pick(colors), rnd(1.5, 3.5), kind, grav);
  }
}
function floatText(x, y, str, color = '#ffd68a', size = 14) { G.texts.push({ x, y, str, color, size, life: 1.6, max: 1.6 }); }
function say(ent, str, life = 2.2) {
  G.speech = G.speech.filter((s) => s.ent !== ent);
  G.speech.push({ ent, str, life });
}
function fireball(x, y, vx, vy, opts = {}) {
  G.projectiles.push({ x, y, vx, vy, r: opts.r || 8, life: opts.life || 4, wobble: opts.wobble || 0, t: 0, baseY: y });
}

/** Fire jets cycle: off -> sputtering warning -> roaring flame. */
const JET_CYCLE = 3.0, JET_OFF = 1.4, JET_WARN = 0.6;
function jetState(j, time) {
  if (j.doused > 0) return { s: 'off', t: 0, doused: true };   // a water balloon put it out for a bit
  return jetCycle(j, time);
}
function jetCycle(j, time) {
  const t = (time + j.phase) % JET_CYCLE;
  if (t < JET_OFF) return { s: 'off', t };
  if (t < JET_OFF + JET_WARN) return { s: 'warn', t: t - JET_OFF };
  return { s: 'on', t: t - JET_OFF - JET_WARN };
}
const jetHitbox = (j) => ({ x: j.x + 9, y: j.y - 3 * T + 8, w: T - 18, h: 3 * T - 10 });

/* ---------------------------------------------------------------- 10. GAME STATE */
const G = {
  state: 'title', paused: false, freeze: false, touchMode: false,
  levelIdx: 0, L: null, player: null, cam: { x: 0 }, time: 0, titleT: 0,
  lives: START_LIVES, score: 0, embers: 0, emberLife: 0, socks: 0, levelSocks: 0,
  levelStart: { score: 0, embers: 0, socks: 0, emberLife: 0, lives: START_LIVES },
  menu: null, menuSel: 0, menuText: '',
  ammo: BALLOON.start, balloons: [], throwCd: 0, throwBuf: 0, emptyMsgT: 0,
  respawn: null, enemies: [], projectiles: [], particles: [], texts: [], speech: [],
  deathT: 0, deathCause: '', quip: '', helmet: null, clearT: 0, overT: 0, shake: 0, banner: null,
  lockMsgT: 0, stats: { deaths: 0 },
};
if ((('ontouchstart' in window) || navigator.maxTouchPoints > 0) && window.matchMedia && matchMedia('(pointer: coarse)').matches) enableTouchUI();

function startGame() {
  G.lives = START_LIVES; G.score = 0; G.embers = 0; G.emberLife = 0; G.socks = 0; G.stats = { deaths: 0 };
  loadLevel(0);
}
function loadLevel(idx) {
  G.levelIdx = idx;
  G.L = parseLevel(idx);
  G.levelStart = { score: G.score, embers: G.embers, socks: G.socks, emberLife: G.emberLife, lives: G.lives };
  G.levelSocks = 0;
  G.ammo = BALLOON.start;               // every level starts with a fresh pouch of 5
  G.respawn = { x: G.L.start.x, y: G.L.start.y };
  G.particles = []; G.texts = []; G.helmet = null;
  resetActors();
  G.state = 'playing'; G.paused = false; G.menu = null;
  G.banner = { title: `LEVEL ${idx + 1}`, name: G.L.def.name, sub: G.L.def.sub, t: 3.6 };
}
/** (Re)creates player, dragons and projectiles: used on level load and respawn. */
function resetActors() {
  G.player = makePlayer(G.respawn.x, G.respawn.y);
  G.enemies = spawnEnemies(G.L);
  G.projectiles = []; G.speech = []; G.balloons = []; G.throwCd = 0; G.throwBuf = 0;
  G.ammo = Math.max(G.ammo, BALLOON.start);   // respawn: topped back up to at least 5
  for (const pk of G.L.balloonPk) pk.taken = false;
  for (const j of G.L.jets) j.doused = 0;
  for (const b of G.L.bubbles) { b.state = 'wait'; b.t = 0.6 + (b.c * 0.61) % 2.2; b.y = b.baseY + 30; }
  for (const [k, cr] of G.L.crumbles) G.L.grid[cr.r][cr.c] = '=';   // bone bridges regrow
  G.L.crumbles.clear();
  if (G.L.hasBoss) G.L.goalLocked = true;
  G.cam.x = clamp(G.player.x - W * 0.35, 0, G.L.w * T - W);
}
/** R key / restart button: restart the current level from its beginning, with lives,
 *  score, embers and socks put back exactly as they were when the level started
 *  (no free extra lives from re-collecting embers, no lost lives either). */
function restartPressed() {
  if (G.state === 'title') return;
  if (G.state === 'victory') { G.state = 'title'; return; }
  if (G.state === 'gameover') { retryLevel(); return; }
  G.lives = G.levelStart.lives;
  G.score = G.levelStart.score; G.embers = G.levelStart.embers; G.socks = G.levelStart.socks; G.emberLife = G.levelStart.emberLife;
  loadLevel(G.levelIdx);
}
function retryLevel() {
  G.lives = START_LIVES;
  G.score = G.levelStart.score; G.embers = G.levelStart.embers; G.socks = G.levelStart.socks; G.emberLife = G.levelStart.emberLife;
  loadLevel(G.levelIdx);
}
function togglePause() {
  if (G.rotateLock) return;
  if (G.state !== 'playing' && G.state !== 'dying') return;
  G.paused = !G.paused; Sound.sfx('pause');
  if (G.paused) openMenu('pause'); else G.menu = null;
}

/* ---- Restart button + pause / confirm menu (DOM overlay; see #hud and #menu) */
const menuEl = document.getElementById('menu'), mRow = document.getElementById('mRow');
const restartBtn = document.getElementById('tRestart');
const MENUS = {
  pause: { title: 'PAUSED', items: [['resume', 'Resume'], ['restart', 'Restart level'], ['startover', 'Start over']] },
  confirm: { title: 'Begin again?', items: [['restart', 'Restart level'], ['startover', 'Start over'], ['cancel', 'Cancel']] },
};
const PAUSE_LINES = ['The dragons politely wait. (They are not polite.)'];
const CONFIRM_LINES = ['Every hero deserves a do-over. The dragons will pretend not to notice.',
  'Rewind time? The lantern can do that. Mostly.', 'The dragons promise to forget everything. (They are lying.)',
  'Restart this level, or go all the way back to the meadow and its mild regret?'];
let menuKey = null;
const menuShown = () => G.paused && !G.rotateLock && (G.state === 'playing' || G.state === 'dying');
const menuItems = () => MENUS[G.menu || 'pause'].items;
function openMenu(kind) {
  G.menu = kind; G.menuSel = kind === 'confirm' ? 2 : 0;   // the safe choice (Cancel / Resume) starts selected
  G.menuText = pick(kind === 'confirm' ? CONFIRM_LINES : PAUSE_LINES);
}
/** Restart button: pause + ask first (no accidental thumb-restarts). */
function openRestartConfirm() {
  if (G.rotateLock || (G.state !== 'playing' && G.state !== 'dying')) return;
  if (!G.paused) Sound.sfx('pause');
  G.paused = true; openMenu('confirm');
}
function menuAction(a) {
  if (a === 'resume' || a === 'cancel') { if (G.paused) togglePause(); }
  else if (a === 'restart') { G.menu = null; restartPressed(); }          // same as the R key
  else if (a === 'startover') { G.menu = null; startGame(); }              // level 1, fresh lives & score
}
function moveMenuSel(d) { const n = menuItems().length; G.menuSel = (G.menuSel + d + n) % n; }
/** Called every frame: shows/hides the restart button and keeps the DOM menu in sync with G. */
function syncHud() {
  const active = (G.state === 'playing' || G.state === 'dying') && !G.rotateLock;
  restartBtn.classList.toggle('hide', !active);
  const kind = menuShown() ? (G.menu || 'pause') : '';
  const key = kind && [kind, G.menuText, G.touchMode].join('|');
  if (key !== menuKey) {
    menuKey = key;
    menuEl.classList.toggle('on', !!kind);
    document.body.classList.toggle('menu-open', !!kind);
    if (kind) {
      document.getElementById('mTitle').textContent = MENUS[kind].title;
      document.getElementById('mText').textContent = G.menuText || PAUSE_LINES[0];
      mRow.innerHTML = '';
      for (const [id, label] of MENUS[kind].items) {
        const d = document.createElement('div'); d.className = 'mbtn'; d.dataset.menu = id; d.textContent = label; d.setAttribute('role', 'button');
        mRow.appendChild(d);
      }
      const back = kind === 'confirm' ? 'cancel' : 'resume';
      document.getElementById('mHint').textContent = G.touchMode ? `Tap outside to ${back}.`
        : `\u2190 \u2192 choose \u2022 Enter select \u2022 Esc ${back} \u2022 R restart \u2022 M mute \u2022 X/J/F throw`;
    }
  }
  if (kind) [...mRow.children].forEach((d, i) => d.classList.toggle('sel', i === G.menuSel));
}
// Mouse support (desktop): HUD buttons + menu. Handled on mousedown like taps; stopPropagation keeps
// the global "click = confirm" handler from also firing.
document.getElementById('hud').addEventListener('mousedown', (e) => {
  const b = e.target.closest('[data-btn]'); if (!b) return;
  e.stopPropagation(); e.preventDefault();
  if (G.rotateLock) return;
  Sound.init(); Sound.resume();
  if (b.dataset.btn === 'pause') togglePause(); else if (b.dataset.btn === 'mute') Sound.toggleMute(); else if (b.dataset.btn === 'restart') openRestartConfirm();
});
menuEl.addEventListener('mousedown', (e) => {
  e.stopPropagation(); e.preventDefault();
  if (G.rotateLock) return;
  const mb = e.target.closest('[data-menu]');
  if (mb) menuAction(mb.dataset.menu); else if (!e.target.closest('.panel')) menuAction(G.menu === 'confirm' ? 'cancel' : 'resume');
});
menuEl.addEventListener('mouseover', (e) => { const mb = e.target.closest('[data-menu]'); if (mb) G.menuSel = [...mRow.children].indexOf(mb); });

function addScore(n, x, y) { G.score += n; if (x !== undefined) floatText(x, y, '+' + n); }
function gainEmber(x, y) {
  G.embers++; G.emberLife++; addScore(50);
  Sound.sfx('ember');
  burst(x, y, 6, ['#ffd27a', '#ff9a3a', '#fff2c0'], 90, 0.4, 'spark', 0);
  if (G.emberLife >= EMBERS_PER_LIFE) {
    G.emberLife -= EMBERS_PER_LIFE; G.lives++;
    floatText(x, y - 20, '+1 LIFE! The lantern burns brighter.', '#9effb5', 15);
    Sound.sfx('oneup');
  }
}

function killPlayer(cause) {
  if (G.state !== 'playing') return;
  const p = G.player;
  G.state = 'dying'; G.deathT = 0; G.deathCause = cause; G.stats.deaths++;
  G.quip = levelLine('quips', cause, QUIPS[cause] || QUIPS.dragon);
  p.dead = true; p.vx = 0;
  G.shake = 0.35;
  if (cause === 'fire' || cause === 'fireball') {
    p.charred = true; p.vy = -380; Sound.sfx('burn');
    burst(p.x + p.w / 2, p.y + p.h / 2, 18, ['#ff7a2a', '#ffd27a', '#ff4a1a'], 160, 0.7, 'spark', -60);
  } else if (cause === 'pit') {
    p.vy = Math.max(p.vy, 200); Sound.sfx('die');
  } else {
    p.vy = -520; p.helmetOff = true; Sound.sfx('die');
    G.helmet = { x: p.x + p.w / 2, y: p.y + 6, vx: -p.face * 110, vy: -460, rot: 0 };
    burst(p.x + p.w / 2, p.y + 8, 10, ['#ffffff', '#ffe28a'], 140, 0.5, 'star', 200);
  }
}
function finishDeath() {
  G.lives--;
  if (G.lives <= 0) { G.state = 'gameover'; G.overT = 0; G.quip = pick(GAMEOVER_QUIPS); Sound.sfx('gameover'); return; }
  resetActors();
  G.player.invuln = 1.5;
  G.helmet = null;
  G.state = 'playing';
}
function levelClear() {
  G.state = 'clear'; G.clearT = 0;
  addScore(1000);
  Sound.sfx('clear');
}
function nextLevel() {
  if (G.levelIdx + 1 < LEVELS.length) loadLevel(G.levelIdx + 1);
  else { G.state = 'victory'; G.overT = 0; G.particles = []; Sound.sfx('clear'); }
}

/** One fixed-timestep update. */
function update(dt) {
  if (G.paused || G.rotateLock) { Input.jumpQueued = false; Input.throwQueued = false; return; }
  G.time += dt;
  G.shake = Math.max(0, G.shake - dt);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  updateParticles(dt);
  switch (G.state) {
    case 'title':
      G.titleT += dt;
      if (Input.consumeJump()) startGame();
      break;
    case 'playing': updatePlaying(dt); break;
    case 'dying': updateDying(dt); break;
    case 'clear':
      G.clearT += dt;
      updateWorld(dt);
      if ((Input.consumeJump() && G.clearT > 1.0) || G.clearT > 6) nextLevel();
      break;
    case 'gameover':
    case 'victory':
      G.overT += dt;
      if (Input.consumeJump() && G.overT > 1.0) { if (G.state === 'gameover') retryLevel(); else G.state = 'title'; }
      break;
  }
}

function updateParticles(dt) {
  for (const q of G.particles) { q.life -= dt; q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  G.particles = G.particles.filter((q) => q.life > 0);
  for (const t of G.texts) { t.life -= dt; t.y -= 24 * dt; }
  G.texts = G.texts.filter((t) => t.life > 0);
  for (const s of G.speech) s.life -= dt;
  G.speech = G.speech.filter((s) => s.life > 0);
}

function updatePlaying(dt) {
  const p = G.player, L = G.L;
  const inp = { left: Input.left(), right: Input.right(), jumpHeld: Input.jumpHeld(), jumpPressed: Input.consumeJump() };
  p.prevBottom = p.y + p.h;
  const ev = {};
  stepPlayer(p, inp, dt, L, ev);
  // juice
  if (ev.jump) { Sound.sfx('jump'); p.squash = 1.25; burst(p.x + p.w / 2, p.y + p.h, 4, ['#8a7a9a', '#5a4a6a'], 50, 0.35, 'dust', 0); }
  if (ev.land) {
    p.squash = clamp(1 - ev.landSpeed / 2400, 0.7, 0.92);
    if (ev.landSpeed > 300) burst(p.x + p.w / 2, p.y + p.h, 5, ['#8a7a9a', '#5a4a6a'], 60, 0.35, 'dust', 0);
  }
  p.squash = lerp(p.squash, 1, Math.min(1, dt * 12));
  if (ev.bump) bumpBlocks(ev.bump);
  if (ev.spring) {
    L.springs.set(ev.spring.c + ',' + ev.spring.r, 0.35); Sound.sfx('boing'); p.squash = 1.35;
    burst(ev.spring.c * T + 16, ev.spring.r * T + 4, 8, ['#ffb0d8', '#fff0f8', '#c86ab0'], 110, 0.45, 'spark', 200);
  }
  if (p.onGround) { // standing on bone bridges starts them crumbling
    const r = Math.floor((p.y + p.h + 1) / T);
    for (let c = Math.floor(p.x / T); c <= Math.floor((p.x + p.w - 0.01) / T); c++) {
      const k = c + ',' + r;
      if (tileAt(L, c, r) === '=' && !L.crumbles.has(k)) { L.crumbles.set(k, { c, r, t: 0, gone: false }); Sound.sfx('creak'); }
    }
  }
  if (p.onGround && Math.abs(p.vx) > 10) p.walkT += dt * Math.abs(p.vx) / 15;
  p.invuln = Math.max(0, p.invuln - dt);

  // --- water balloons (X / J / F / balloon button); a press is buffered briefly through the cooldown
  if (Input.throwQueued) { Input.throwQueued = false; G.throwBuf = 0.15; }
  G.throwCd -= dt; G.throwBuf -= dt; G.emptyMsgT -= dt;
  if (G.throwBuf > 0 && G.throwCd <= 0 && G.balloons.length < BALLOON.maxOut) { G.throwBuf = 0; throwBalloon(); }

  const hz = hazardAt(p, L);
  if (hz) { killPlayer(hz); return; }

  updateWorld(dt);
  if (G.state !== 'playing') return;

  // --- pickups
  const pb = { x: p.x, y: p.y, w: p.w, h: p.h };
  for (const e of L.embers) if (!e.taken && overlap(pb, { x: e.x - 8, y: e.y - 8, w: 16, h: 16 })) { e.taken = true; gainEmber(e.x, e.y); }
  for (const pk of L.balloonPk) if (!pk.taken && G.ammo < BALLOON.max && overlap(pb, { x: pk.x - 11, y: pk.y - 13, w: 22, h: 26 })) {
    pk.taken = true; G.ammo = Math.min(BALLOON.max, G.ammo + BALLOON.pickup); Sound.sfx('pickup');
    floatText(pk.x, pk.y - 22, pick(['+3 water balloons!', '+3 balloons. Dragons hate bath time.', '+3 splashy diplomacy']), '#9ad8ff', 13);
    burst(pk.x, pk.y, 10, ['#9ad8ff', '#ffffff', '#5ab8ff'], 100, 0.5, 'spark', 200);
  }
  for (const s of L.socks) if (!s.taken && overlap(pb, { x: s.x - 10, y: s.y - 10, w: 20, h: 20 })) {
    s.taken = true; G.socks++; G.levelSocks++; addScore(500, s.x, s.y - 10); Sound.sfx('sock');
    floatText(s.x, s.y - 28, pick(['A lost sock! Still damp.', 'Sock found! Its partner remains a mystery.', 'Ooh, argyle.']), '#e6c6ff', 13);
    burst(s.x, s.y, 14, ['#e6c6ff', '#ffd27a', '#ffffff'], 120, 0.6, 'star', 0);
  }
  // --- checkpoints
  for (const cp of L.checkpoints) {
    if (!cp.lit && overlap(pb, { x: cp.x + 2, y: cp.y - 2 * T, w: T - 4, h: 2 * T })) {
      cp.lit = true; G.respawn = { x: cp.x + (T - PW) / 2, y: cp.y - PH };
      Sound.sfx('checkpoint');
      floatText(cp.x + 16, cp.y - 74, 'Checkpoint! The lantern believes in you.', '#ffe6a8', 13);
      burst(cp.x + 16, cp.y - 56, 16, ['#ffd27a', '#ffffff', '#ff9a3a'], 110, 0.7, 'star', 0);
    }
  }
  // --- goal
  if (overlap(pb, goalRect(L))) {
    if (L.goalLocked) {
      if (G.lockMsgT <= 0) { floatText(L.goal.x + 16, L.goal.y - 90, 'Locked! Old Smolder sits on the key.', '#ffb08a', 13); Sound.sfx('locked'); G.lockMsgT = 2; }
    } else { levelClear(); return; }
  }
  G.lockMsgT -= dt;
  updateCamera(dt);
}

/** Enemies, hazards & projectiles. Runs during play, death animation and level-clear. */
function updateWorld(dt) {
  const L = G.L, p = G.player;
  const playing = G.state === 'playing';
  const pb = { x: p.x + 2, y: p.y + 2, w: p.w - 4, h: p.h - 2 };
  // --- crumbling bone bridges: shake -> fall away -> regrow (unless someone is standing in the gap)
  for (const [k, cr] of L.crumbles) {
    cr.t += dt;
    if (!cr.gone && cr.t >= CRUMBLE_DELAY) {
      cr.gone = true; L.grid[cr.r][cr.c] = ',';
      burst(cr.c * T + 16, cr.r * T + 6, 7, ['#d8d0c0', '#a89f90', '#6e675e'], 70, 0.7, 'dust', 500);
      Sound.sfx('crumble');
    } else if (cr.gone && cr.t >= CRUMBLE_DELAY + CRUMBLE_REGROW && !overlap(p, { x: cr.c * T, y: cr.r * T - 2, w: T, h: T + 2 })) {
      L.grid[cr.r][cr.c] = '='; L.crumbles.delete(k);
    }
  }
  for (const [k, t] of L.springs) { if (t - dt <= 0) L.springs.delete(k); else L.springs.set(k, t - dt); }
  // --- fire jets (a doused jet stays out ~2s, and only relights via its normal sputtering warning)
  for (const j of L.jets) {
    if (j.doused > 0) {
      j.doused -= dt;
      if (Math.random() < 0.15 && j.x > G.cam.x - 64 && j.x < G.cam.x + W + 64) addParticle(j.x + rnd(8, 24), j.y - 8, rnd(-10, 10), rnd(-50, -25), 0.8, '#b8c0cc', rnd(3, 5), 'smoke', -10);
      if (j.doused <= 0 && jetCycle(j, G.time).s === 'on') j.doused = 0.01;
    }
    const st = jetState(j, G.time);
    const on = st.s === 'on';
    const near = j.x > G.cam.x - 64 && j.x < G.cam.x + W + 64;
    if (on && !j.wasOn && near) Sound.sfx('jet');
    j.wasOn = on;
    if (near && st.s === 'warn' && Math.random() < 0.3) addParticle(j.x + rnd(10, 22), j.y - 6, rnd(-20, 20), rnd(-80, -40), 0.4, '#ffb04a', 2, 'spark', 0);
    if (on && playing && overlap(pb, jetHitbox(j))) { killPlayer('fire'); return; }
  }
  // --- leaping lava fireballs (telegraphed by bubbling sparks)
  for (const b of L.bubbles) {
    b.t -= dt;
    if (b.state === 'wait' && b.t <= 0) { b.state = 'warn'; b.t = 0.6; }
    else if (b.state === 'warn') {
      if (Math.random() < 0.4) addParticle(b.x + rnd(-8, 8), b.baseY + 2, rnd(-15, 15), rnd(-70, -30), 0.4, '#ffd27a', 2, 'spark', 0);
      if (b.t <= 0) { b.state = 'fly'; b.y = b.baseY + 8; b.vy = -640; }
    } else if (b.state === 'fly') {
      b.vy += PHYS.gravity * dt; b.y += b.vy * dt;
      if (Math.random() < 0.5) addParticle(b.x + rnd(-5, 5), b.y + 8, rnd(-10, 10), rnd(10, 40), 0.35, '#ff8a2a', 2.5, 'spark', 0);
      if (b.vy > 0 && b.y > b.baseY + 20) { b.state = 'wait'; b.t = 1.4 + (b.c % 3) * 0.3; }
      if (playing && overlap(pb, { x: b.x - 10, y: b.y - 10, w: 20, h: 20 })) { killPlayer('fireball'); return; }
    }
  }
  // --- dragons
  for (const e of G.enemies) {
    if (e.type === 'snap') updateSnap(e, dt, L);
    else if (e.type === 'grum') updateGrum(e, dt);
    else if (e.type === 'boss') updateBoss(e, dt);
    else if (e.type === 'droop') updateDroop(e, dt, L);
    if (playing && G.state !== 'playing') return;
  }
  G.enemies = G.enemies.filter((e) => e.alive || e.deadT < 2.5 || e.type === 'boss');
  // --- projectiles
  for (const f of G.projectiles) {
    f.t += dt; f.life -= dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.wobble) f.y = f.baseY + Math.sin(f.t * 10) * f.wobble;
    if (Math.random() < 0.6) addParticle(f.x - Math.sign(f.vx) * 6, f.y + rnd(-3, 3), -f.vx * 0.1, rnd(-20, 20), 0.3, pick(['#ff8a2a', '#ffd27a']), 2.5, 'spark', 0);
    if (isSolid(tileAt(L, Math.floor(f.x / T), Math.floor(f.y / T)))) { f.life = 0; burst(f.x, f.y, 6, ['#555', '#777'], 50, 0.5, 'smoke', -30); }
    if (playing && f.life > 0 && overlap(pb, { x: f.x - f.r + 2, y: f.y - f.r + 2, w: f.r * 2 - 4, h: f.r * 2 - 4 })) { killPlayer('fireball'); return; }
  }
  G.projectiles = G.projectiles.filter((f) => f.life > 0 && f.x > G.cam.x - 200 && f.x < G.cam.x + W + 200);
  updateBalloons(dt);
}

/* ---- Water balloons ---------------------------------------------------- */
function throwBalloon() {
  const p = G.player;
  if (G.ammo <= 0) {
    if (G.emptyMsgT <= 0) { floatText(p.x + p.w / 2, p.y - 18, pick(EMPTY_QUIPS), '#b8c8e0', 13); G.emptyMsgT = 1.2; }
    Sound.sfx('squeak'); G.throwCd = BALLOON.cooldown;
    return false;
  }
  G.ammo--; G.throwCd = BALLOON.cooldown; p.throwT = 0.18;
  G.balloons.push({ x: p.x + p.w / 2 + p.face * 10, y: p.y + 14, vx: p.face * BALLOON.vx + p.vx * 0.35, vy: BALLOON.vy + Math.min(0, p.vy) * 0.25, t: 0, alive: true });
  Sound.sfx('throw');
  return true;
}
/** Pop a balloon: splash droplets + a puff of steam (+ hiss if it hit something hot). */
function splash(x, y, hot) {
  burst(x, y, 12, ['#9ad8ff', '#5ab8ff', '#e8f6ff'], 150, 0.5, 'spark', 600);
  burst(x, y - 4, hot ? 8 : 4, ['#d8dde6', '#aab2c0'], 40, hot ? 1.1 : 0.7, 'smoke', -40);
  Sound.sfx(hot ? 'hiss' : 'pop');
}
function updateBalloons(dt) {
  const L = G.L, R = BALLOON.r;
  for (const b of G.balloons) {
    if (!b.alive) continue;
    b.t += dt;
    const prevY = b.y;
    b.vy += BALLOON.grav * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    const box = { x: b.x - R, y: b.y - R, w: R * 2, h: R * 2 };
    const pop = (hot) => { b.alive = false; splash(b.x, b.y, hot); };
    // dragons first (so a balloon skimming a ledge still hits the lizard on it)
    let hit = null;
    for (const e of G.enemies) {
      if (!e.alive || e.state === 'dead') continue;
      const hb = e.type === 'boss' ? { x: e.x + 8, y: e.y + 8, w: e.w - 16, h: e.h - 8 } : e;
      if (overlap(box, hb)) { hit = e; break; }
    }
    if (hit) { pop(true); balloonHit(hit, b); continue; }
    // dragon fireballs and leaping lava blobs get put out
    const f = G.projectiles.find((q) => q.life > 0 && Math.hypot(q.x - b.x, q.y - b.y) < q.r + R);
    if (f) { f.life = 0; pop(true); floatText(b.x, b.y - 14, 'Fizzle!', '#c8e8ff', 12); addScore(25); continue; }
    const lb = L.bubbles.find((q) => q.state === 'fly' && Math.hypot(q.x - b.x, q.y - b.y) < 10 + R);
    if (lb) { lb.state = 'wait'; lb.t = 1.6; lb.y = lb.baseY + 30; pop(true); continue; }
    // fire jets (lit or sputtering) get doused for ~2s
    const jet = L.jets.find((j) => jetState(j, G.time).s !== 'off' && overlap(box, jetHitbox(j)));
    if (jet) { jet.doused = BALLOON.jetDouse; pop(true); floatText(jet.x + 16, jet.y - 60, 'Psssht.', '#c8e8ff', 12); continue; }
    // walls, floors, planks, hazards
    const c = Math.floor(b.x / T), r = Math.floor(b.y / T), ch = tileAt(L, c, r);
    const below = tileAt(L, c, Math.floor((b.y + R) / T));
    if (isSolid(ch) || isSolid(tileAt(L, Math.floor((b.x + Math.sign(b.vx) * R) / T), r))) { pop(false); continue; }
    if (b.vy > 0 && isOneWay(below) && prevY + R <= Math.floor((b.y + R) / T) * T + 1) { pop(false); continue; }
    if (isHazardTile(ch) || isHazardTile(below)) { pop(below === '~' || ch === '~'); continue; } // splash + hiss; spikes & lava don't care
    if (b.y > L.h * T + 40 || b.t > 4) b.alive = false;
  }
  G.balloons = G.balloons.filter((b) => b.alive);
}
/** What a water balloon does to each kind of dragon. */
function balloonHit(e, b) {
  const ex = e.x + e.w / 2;
  if (e.type === 'snap') {             // 1 hit: fizzles into steam
    e.alive = false; e.deadT = 0; e.steamed = true; addScore(200, ex, e.y - 6); say(e, 'mip... (soggy)', 1.3);
    burst(ex, e.y + 8, 10, ['#d8dde6', '#ffffff'], 50, 1.0, 'smoke', -50);
  } else if (e.type === 'droop') {     // 1 hit (even while hanging): plops down as a puddle of grumbles
    e.alive = false; e.deadT = 0; e.steamed = true; addScore(250, ex, e.y - 6); say(e, 'drip...', 1.2);
    burst(ex, e.y + 8, 10, ['#d8dde6', '#ffffff'], 50, 1.0, 'smoke', -50);
  } else if (e.type === 'grum') {      // 2 hits: first one makes it soggy (no fire for a while)
    e.wet = (e.wet || 0) + 1;
    if (e.wet >= 2) {
      e.alive = false; e.deadT = 0; e.vy = -150; addScore(400, ex, e.y - 6); say(e, 'Grumble... (damp)', 1.4);
      burst(ex, e.y + 10, 12, ['#d8dde6', '#ffffff'], 60, 1.0, 'smoke', -50);
    } else { e.soggy = 4; e.puff = 0; say(e, levelLine('talk', 'soggy', GRUM_SOGGY), 1.8); addScore(50, ex, e.y - 6); }
  } else if (e.type === 'boss') {
    if (e.state === 'sleep' || e.state === 'hurt') { say(e, e.state === 'sleep' ? 'Zzz... *splutter* ...zzz' : 'Not while I\'m sulking!', 1.4); return; }
    if (e.state === 'windup') { // douse the telegraphed breath: attack cancelled
      e.state = 'pace'; e.stateT = 0; e.vx = 0; G.shake = Math.max(G.shake, 0.12);
      burst(e.x + e.w / 2 + e.face * 50, e.y + 30, 16, ['#d8dde6', '#ffffff', '#aab2c0'], 60, 1.4, 'smoke', -40);
      floatText(e.x + e.w / 2, e.y - 34, 'Breath doused!', '#c8e8ff', 14); addScore(150);
    }
    say(e, pick(BOSS_DOUSED), 2);
    e.wetHits = (e.wetHits || 0) + 1;
    if (e.wetHits >= BALLOON.bossWet) { e.wetHits = 0; bossDamage(e, 'balloon'); }
  }
  if (!e.alive) floatText(ex, e.y - 22, pick(SPLASH_WORDS), '#9ad8ff', 13);
}

/** Shared stomp test: falling onto the top part of an enemy. */
function isStomp(p, e, slack = 10) { return p.vy > 0 && p.prevBottom <= e.y + slack; }
function bounce(p, strong) {
  const held = Input.jumpHeld();
  p.vy = -(strong ? 620 : held ? PHYS.stompBounceHeld : PHYS.stompBounce);
  p.jumping = held && !strong; p.onGround = false; p.coyote = 0;
}

function updateSnap(e, dt, L) {
  const p = G.player;
  if (!e.alive) { e.deadT += dt; return; }
  if (e.x < G.cam.x - 300 || e.x > G.cam.x + W + 300) return; // nap when far off-screen
  e.t += dt;
  e.vx = e.dir * 42;
  e.vy = Math.min(e.vy + PHYS.gravity * dt, PHYS.maxFall);
  const res = moveBody(e, e.vx * dt, e.vy * dt, L);
  if (res.wallL) e.dir = 1; else if (res.wallR) e.dir = -1;
  if (res.floor) { // turn around at ledges and hazards, like a sensible lizard
    const fx = e.dir > 0 ? e.x + e.w + 1 : e.x - 1, c = Math.floor(fx / T);
    const below = tileAt(L, c, Math.floor((e.y + e.h + 2) / T)), here = tileAt(L, c, Math.floor((e.y + e.h - 2) / T));
    if (!(isSolid(below) || isOneWay(below)) || isHazardTile(here) || isHazardTile(below)) e.dir *= -1;
  }
  if (e.y > L.h * T + 40) { e.alive = false; e.deadT = 9; }
  e.talk -= dt; if (e.talk <= 0) { e.talk = rnd(6, 12); if (Math.abs(e.x - p.x) < 300) say(e, levelLine('talk', 'snap', SNAP_TALK), 1.4); }
  if (G.state !== 'playing' || p.dead) return;
  if (overlap(p, e)) {
    if (isStomp(p, e)) {
      e.alive = false; e.deadT = 0; bounce(p); Sound.sfx('stomp'); G.shake = 0.08;
      addScore(200, e.x + 12, e.y - 6); say(e, 'mip...', 1.2);
      burst(e.x + 12, e.y + 10, 10, ['#ffffff', '#ffe28a', '#9fe0b0'], 120, 0.5, 'star', 200);
    } else if (p.invuln <= 0) killPlayer('dragon');
  }
}

function updateGrum(e, dt) {
  const p = G.player;
  if (!e.alive) { e.deadT += dt; e.vy += PHYS.gravity * dt; e.y += e.vy * dt; e.rot += dt * 9; return; }
  e.t += dt;
  const cx = e.baseX + Math.sin(e.t * 0.7) * 56, cy = e.baseY + Math.sin(e.t * 2.1) * 26;
  e.x = cx - e.w / 2; e.y = cy - e.h / 2;
  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  e.face = pcx < cx ? -1 : 1;
  const onScreen = cx > G.cam.x - 20 && cx < G.cam.x + W + 20;
  if (e.soggy > 0) {
    e.soggy -= dt;
    if (Math.random() < dt * 10) addParticle(cx + e.face * 14, cy, rnd(-10, 10), rnd(-40, -15), 0.7, '#c0c8d4', rnd(2, 4), 'smoke', -10);
  }
  if (onScreen && G.state === 'playing' && !p.dead && e.soggy > 0) {
    e.talk -= dt; if (e.talk <= 0) { e.talk = rnd(5, 9); say(e, '*sputter*', 1.2); }
  } else if (onScreen && G.state === 'playing' && !p.dead) {
    if (e.puff > 0) {
      e.puff -= dt;
      if (e.puff <= 0) { // spit a slow, readable fireball at the hero
        const dx = pcx - cx, dy = pcy - cy, len = Math.hypot(dx, dy) || 1;
        fireball(cx + e.face * 14, cy + 4, dx / len * 165, dy / len * 165, { r: 8, life: 4 });
        Sound.sfx('spit');
      }
    } else {
      e.spit -= dt;
      if (e.spit <= 0 && Math.hypot(pcx - cx, pcy - cy) < 380) { e.puff = 0.65; e.spit = rnd(2.6, 3.8); }
    }
    e.talk -= dt; if (e.talk <= 0) { e.talk = rnd(7, 13); say(e, levelLine('talk', 'grum', GRUM_TALK), 1.6); }
  }
  if (G.state !== 'playing' || p.dead) return;
  if (overlap(p, e)) {
    if (isStomp(p, e, 12)) {
      e.alive = false; e.deadT = 0; e.vy = -150; bounce(p); Sound.sfx('stomp'); G.shake = 0.1;
      addScore(400, cx, e.y - 6); say(e, 'Grumble...!', 1.4);
      burst(cx, cy, 12, ['#ffffff', '#ffe28a', '#c8a0e0'], 130, 0.5, 'star', 200);
    } else if (p.invuln <= 0) killPlayer('dragon');
  }
}

/** Droopling: hang (upside down) -> shake ("!", telegraph) -> drop -> dizzy -> waddle.
 *  Deadly while dropping or on contact; stompable once it has landed. */
function updateDroop(e, dt, L) {
  const p = G.player;
  if (!e.alive) { e.deadT += dt; return; }
  if (e.state !== 'drop' && (e.x < G.cam.x - 300 || e.x > G.cam.x + W + 300)) return;
  e.t += dt; e.st += dt;
  const pcx = p.x + p.w / 2, ecx = e.x + e.w / 2;
  const live = G.state === 'playing' && !p.dead;
  switch (e.state) {
    case 'hang':
      if (live && Math.abs(pcx - ecx) < 64 && p.y > e.y + 8 && p.y - e.y < 12 * T) {
        e.state = 'shake'; e.st = 0; say(e, levelLine('talk', 'droop', DROOP_TALK), 1.1); Sound.sfx('eep');
      }
      break;
    case 'shake': if (e.st > 0.45) { e.state = 'drop'; e.st = 0; e.vy = 60; } break;
    case 'drop': {
      e.vy = Math.min(e.vy + PHYS.gravity * dt, PHYS.maxFall);
      const res = moveBody(e, 0, e.vy * dt, L);
      if (res.floor) {
        e.state = 'dizzy'; e.st = 0; G.shake = Math.max(G.shake, 0.06); Sound.sfx('thud');
        burst(ecx, e.y + e.h, 6, ['#8a7a9a', '#5a4a6a'], 60, 0.4, 'dust', 0);
      }
      break;
    }
    case 'dizzy': if (e.st > 0.7) { e.state = 'walk'; e.dir = pcx < ecx ? -1 : 1; } break;
    case 'walk': {
      e.vx = e.dir * 48;
      e.vy = Math.min(e.vy + PHYS.gravity * dt, PHYS.maxFall);
      const res = moveBody(e, e.vx * dt, e.vy * dt, L);
      if (res.wallL) e.dir = 1; else if (res.wallR) e.dir = -1;
      if (res.floor) { // same sensible ledge/hazard avoidance as the Snaplings
        const fx = e.dir > 0 ? e.x + e.w + 1 : e.x - 1, c = Math.floor(fx / T);

/** Old Smolder: sleep -> intro -> (pace -> windup -> breathe)* ; 3 stomps -> defeated. */
function updateBoss(b, dt) {
  const p = G.player;
  b.t += dt; b.stateT += dt;
  const bcx = b.x + b.w / 2, pcx = p.x + p.w / 2;
  const ground = b.y + b.h;
  const set = (s) => { b.state = s; b.stateT = 0; };
  const faster = 3 - b.hp; // a little quicker after each hit
  switch (b.state) {
    case 'sleep':
      if (Math.random() < dt * 1.2) G.texts.push({ x: bcx + b.face * 30, y: b.y + 10, str: 'z', color: '#d8d0ff', size: 16, life: 1.5, max: 1.5 });
      if (G.state === 'playing' && Math.abs(pcx - bcx) < 430) {
        set('intro'); Sound.sfx('roar'); G.shake = 0.4;
        G.banner = { title: 'OLD SMOLDER', name: 'Dragon. Retired. Grumpy about it.', sub: 'Three stomps on the noggin should do it.', t: 3.2 };
        say(b, 'Who dares wake me?! Oh. A nightlight.', 2.6);
      }
      break;
    case 'intro':
      b.face = pcx < bcx ? -1 : 1;
      if (b.stateT > 1.8) set('pace');
      break;
    case 'pace': {
      if (b.vx === 0) b.vx = (pcx < bcx ? -1 : 1) * 60;
      b.x += b.vx * dt;
      if (b.x < b.minX) { b.x = b.minX; b.vx = Math.abs(b.vx); }
      if (b.x > b.maxX) { b.x = b.maxX; b.vx = -Math.abs(b.vx); }
      b.face = pcx < bcx ? -1 : 1;
      b.taunt -= dt; if (b.taunt <= 0) { b.taunt = rnd(4, 6); say(b, pick(BOSS_TAUNTS), 2.2); }
      if (b.stateT > 2.4 - faster * 0.4) { set('windup'); b.vx = 0; Sound.sfx('roar'); }
      break;
    }
    case 'windup': // telegraph: glowing mouth, smoke, shaking, "!" above head
      if (b.stateT < 0.05) b.face = pcx < bcx ? -1 : 1;
      if (Math.random() < dt * 20) addParticle(bcx + b.face * 50, b.y + 30, rnd(-20, 20), rnd(-60, -20), 0.8, '#7a6a7a', rnd(3, 7), 'smoke', -10);
      if (b.stateT > 1.0 - faster * 0.12) { set('breathe'); b.fireT = 0; }
      break;
    case 'breathe':
      b.fireT -= dt;
      if (b.fireT <= 0) {
        b.fireT = 0.26;
        fireball(bcx + b.face * 52, ground - 30, b.face * 240, 0, { r: 10, life: 3.2, wobble: 3 });
        Sound.sfx('breath');
      }
      if (b.stateT > 1.3) set('pace');
      break;
    case 'hurt':
      b.x += (b.homeX - b.x) * Math.min(1, dt * 1.5);
      if (b.stateT > 1.3) set('pace');
      break;
    case 'dead':
      b.deadT += dt;
      if (Math.random() < dt * 4) addParticle(bcx + rnd(-30, 30), b.y + 20, rnd(-10, 10), -30, 1.2, '#5a5060', rnd(4, 8), 'smoke', -10);
      return;
  }
  if (G.state !== 'playing' || p.dead) return;
  if (b.state === 'hurt' || b.state === 'sleep') return; // harmless while recovering / asleep
  if (overlap(p, b) && isStomp(p, b, 18)) {
    bounce(p, true); p.vx = (pcx < bcx ? -1 : 1) * 300;
    bossDamage(b, 'stomp');
    return;
  }
  if (p.invuln <= 0 && overlap(p, { x: b.x + 12, y: b.y + 18, w: b.w - 24, h: b.h - 18 })) killPlayer('boss');
}

/** One of Old Smolder's 3 "hits": a stomp, or 4 water balloons. */
function bossDamage(b, how) {
  const bcx = b.x + b.w / 2;
  b.hp--; b.state = 'hurt'; b.stateT = 0;
  G.shake = 0.3; addScore(1000, bcx, b.y - 10); Sound.sfx('bosshit');
  burst(bcx, b.y + 8, 16, how === 'stomp' ? ['#ffffff', '#ffe28a', '#ff9a3a'] : ['#ffffff', '#9ad8ff', '#d8dde6'], 160, 0.6, 'star', 200);

// Offline support: register the service worker (only works over http(s), not file://).
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed', err)); });
  // A new version was deployed: the new service worker takes over (skipWaiting + clients.claim).
  // If we're sitting on the title screen, reload right away so the update shows; mid-game we
  // never interrupt; the new version simply loads next time the app is opened.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;            // first install, nothing to update
    if (G.state === 'title') location.reload(); else G.updateReady = true;
  });
}

/* ---------------------------------------------------------------- 13. DEBUG / TEST HOOKS
   window.__game exposes state and helpers for automated tests:
     __game.start(i)            start a fresh game at level i
     __game.teleport(col,row)   move the hero (tile coords, feet standing in row)
     __game.step(n, input)      run n fixed physics steps holding {left,right,jump}
     __game.press()             queue a jump press (edge) for the next step
     __game.throw()             queue a water-balloon throw
     __game.analyze(i)          physics-based completability search for level i
     __game.jumpStats()         measured max jump height / running jump distance */
function analyzeLevel(idx) {
  const L = parseLevel(idx);
  const gr = goalRect(L);
  const t0 = performance.now();
  const standY = (r) => (r + 1) * T - PH;
  const cellOf = (p) => [Math.floor((p.x + p.w / 2) / T), Math.floor((p.y + p.h - 1) / T)];
  const sockHit = new Set();
  const embedded = (x, y) => {
    for (let c = Math.floor(x / T); c <= Math.floor((x + PW - 0.01) / T); c++)
      for (let r = Math.floor(y / T); r <= Math.floor((y + PH - 0.01) / T); r++) if (isSolid(tileAt(L, c, r))) return true;
    return false;
  };
  // Simulates one input plan from rest (or running) on a cell; collects landing cells.
  function sim(x0, r, vx0, plan, maxSteps, walk) {
    const p = makePlayer(x0, standY(r)); p.vx = vx0; p.onGround = true; p.coyote = PHYS.coyoteTime;
    const out = [];
    let airborne = false;
    for (let i = 0; i < maxSteps; i++) {
      stepPlayer(p, plan(i), DT, L, null);
      for (let k = 0; k < L.socks.length; k++) if (overlap(p, { x: L.socks[k].x - 10, y: L.socks[k].y - 10, w: 20, h: 20 })) sockHit.add(k);
      if (overlap(p, gr)) return { goal: true, out };
      if (hazardAt(p, L)) return { dead: true, out };
      if (!p.onGround) airborne = true;
      else if (walk) out.push(cellOf(p));
      else if (airborne) { out.push(cellOf(p)); return { out }; }
    }
    return { out };
  }
  const plans = [];
  for (const dir of [-1, 0, 1]) for (const hold of [1, 6, 12, 20, 30, 999])
    plans.push((i) => ({ left: dir < 0, right: dir > 0, jumpPressed: i === 0, jumpHeld: i < hold }));
  for (const dir of [-1, 1]) {
    for (const k of [8, 20, 35]) plans.push((i) => ({ left: dir < 0 && i >= k, right: dir > 0 && i >= k, jumpPressed: i === 0, jumpHeld: true }));
    for (const k of [10, 25]) plans.push((i) => ({ left: dir < 0 && i < k, right: dir > 0 && i < k, jumpPressed: i === 0, jumpHeld: true }));
  }
  const startCell = [Math.floor((L.start.x + PW / 2) / T), Math.floor((L.start.y + PH - 1) / T)];
  const key = (c) => c[0] + ',' + c[1];
  const seen = new Map([[key(startCell), null]]);
  const queue = [startCell];
  let found = null, sims = 0;
  while (queue.length && !found) {
    const cell = queue.shift();
    const [c, r] = cell;
    const visit = (n) => { const k = key(n); if (!seen.has(k)) { seen.set(k, key(cell)); queue.push(n); } };
    const cxp = c * T + (T - PW) / 2;
    for (const dir of [-1, 1]) {
      sims++;
      const res = sim(cxp, r, 0, () => ({ left: dir < 0, right: dir > 0, jumpPressed: false, jumpHeld: false }), 90, true);
      if (res.goal) { found = cell; break; }
      res.out.forEach(visit);
    }
    if (found) break;
    outer: for (const off of [-8, 0, 8]) for (const vx0 of [0, -PHYS.runSpeed, PHYS.runSpeed]) for (const plan of plans) {
      if (embedded(cxp + off, standY(r))) continue;   // never start a sim inside a wall (it could "climb" it)
      sims++;
      const res = sim(cxp + off, r, vx0, plan, 360, false);
      if (res.goal) { found = cell; break outer; }
      res.out.forEach(visit);
    }
  }
  const path = [];
  if (found) { let k = key(found); while (k) { path.unshift(k); k = seen.get(k); } }
  return { level: idx + 1, completable: !!found, explored: seen.size, sims, pathCells: path.length,
    path: path.join(' '), socksTouchedDuringSearch: sockHit.size + '/' + L.socks.length, ms: Math.round(performance.now() - t0) };
}
function jumpStats() {
  const L = { w: 400, h: 14, grid: Array.from({ length: 14 }, (_, r) => Array(400).fill(r >= 12 ? '#' : '.')) };
  const p = makePlayer(64, 12 * T - PH); p.onGround = true; p.vx = PHYS.runSpeed;
  let minY = p.y, steps = 0, airborne = false;
  const x0 = p.x;
  for (; steps < 600; steps++) {
    stepPlayer(p, { right: true, jumpPressed: steps === 0, jumpHeld: true }, DT, L, null);
    minY = Math.min(minY, p.y);
    if (!p.onGround) airborne = true; else if (airborne) break;
  }
  const hop = makePlayer(64, 12 * T - PH); hop.onGround = true;
  let hopMin = hop.y;
  for (let i = 0; i < 200; i++) { stepPlayer(hop, { jumpPressed: i === 0, jumpHeld: i < 1 }, DT, L, null); hopMin = Math.min(hopMin, hop.y); }
  return { maxHeightPx: Math.round(12 * T - PH - minY), maxHeightTiles: +((12 * T - PH - minY) / T).toFixed(2),
    runJumpDistancePx: Math.round(p.x - x0), runJumpDistanceTiles: +((p.x - x0) / T).toFixed(2), airtime: +(steps * DT).toFixed(3),
    minHopPx: Math.round(12 * T - PH - hopMin) };
}
window.__game = {
  G, PHYS, LEVELS, Input,
  get state() { return G.state; },
  start(i = 0) { startGame(); if (i) loadLevel(i); G.banner = null; },
  teleport(col, row) { const p = G.player; p.x = col * T + (T - PW) / 2; p.y = (row + 1) * T - PH; p.vx = p.vy = 0; G.cam.x = clamp(p.x - W * 0.4, 0, G.L.w * T - W); },
  step(n, input) { Input.sim = input || {}; for (let i = 0; i < n; i++) update(DT); Input.sim = null; },
  press() { Input.jumpQueued = true; },
  throw() { Input.throwQueued = true; },
  analyze: analyzeLevel, jumpStats, goalRect: () => goalRect(G.L),
};
</script>
